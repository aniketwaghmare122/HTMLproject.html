<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Website</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff8e1;
        }
        nav {
            background-color: #000;
            padding: 20px;
            text-align: right;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 20px;
        }
        header {
            background: url('https://cdn.pixabay.com/photo/2016/03/05/19/02/spices-1239428_1280.jpg') center/cover no-repeat;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        header h1 {
            color: orange;
            font-size: 60px;
            text-shadow: 2px 2px 5px black;
        }
        main {
            display: flex;
            padding: 20px;
        }
        aside {
            width: 25%;
            background-color: #ffcc80;
            padding: 20px;
            border-radius: 10px;
        }
        aside h2 {
            text-align: center;
            color: #d84315;
        }
        aside ul {
            list-style-type: square;
            font-size: 20px;
        }
        section {
            width: 70%;
            margin-left: 5%;
        }
        section img {
            height: 200px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
        }
        .video-section {
            margin: 20px 0;
        }
        .contact {
            background: linear-gradient(to right, #43a047, #66bb6a);
            padding: 30px;
            color: white;
            border-radius: 10px;
        }
        .contact h2 {
            text-align: center;
            font-size: 40px;
        }
        label, input, textarea {
            display: block;
            margin: 10px auto;
            width: 80%;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 30px;
            font-size: 20px;
            background-color: orange;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff9800;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Contact</a>
    </nav>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <aside>
           <h2>✨ Famous for...</h2>
<ul class="famous-list">
  <li>🥮 Puranpoli</li>
  <li>🍬 Modak</li>
  <li>🥛 Basundi</li>
  <li>🍲 Pavbhaji</li>
  <li>🌶️ Misal Pav</li>
  <li>🍚 Veg Biryani / Pulao</li>
  <li>🥯 Pital Bhakri</li>
</ul>
        </aside>

        <section>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd
        9GcTlQ2EQ_K8fMgos4BnXLUii6uvfwEhbB6I1sv_wQU6uFA&s=10" alt="Puranpoli">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd
        9GcTMZHM4Y05jFAr3tQaBdYr1xMN7bdeGY1m6TBEqanI_TA&s=10" alt="Modak">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd
        9GcRCnjy3j1TW4lvP3gcVOpHzdqahM8AcMYgWvVOIvAXGsw&s=10" alt="Basundi">
        <img src="https://tse1.mm.bing.net/th/id/OIP.kfbLiKacCe76Ngn7vpnCjwHaHa?r=0&w=700&h=700&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Pavbhaji">

            <div class="video-section">
                <video src="./video1.mp4" controls height="300px" width="100%" autoplay muted></video>
            </div>
        </section>
    </main>

    <div class="contact">
        <h2>Contact Us</h2>
        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name">
            <label>Email:</label>
            <input type="email" placeholder="Enter your email">
            <label>Contact:</label>
            <input type="tel" placeholder="Enter your phone number">
            <label>Message:</label>
            <textarea rows="4" placeholder="Write your message"></textarea>
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
